name: Reusable Workflow To Deploy MuleSoft Application

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that supplies secrets and variables
        type: string
        required: false
        default: dev
      common-ref:
        description: Branch or tag of common-pipeline to take maven/settings.xml from
        type: string
        required: false
        default: main
      java-version:
        type: string
        required: false
        default: '17'
      maven-version:
        description: Maven version (mule-maven-plugin 4.10.1 needs a 3.9.x release)
        type: string
        required: false
        default: '3.9.9'

permissions:
  contents: read

jobs:
  build:
    name: Build and publish to Exchange
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout common-pipeline (for maven/settings.xml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/common-pipeline
          ref: ${{ inputs.common-ref }}
          path: common
          token: ${{ secrets.COMMON_REPO_TOKEN || github.token }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up Maven ${{ inputs.maven-version }}
        env:
          MAVEN_VERSION: ${{ inputs.maven-version }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar xz -C "$HOME"
          echo "$HOME/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$HOME/apache-maven-${MAVEN_VERSION}/bin/mvn" -v

      - name: Build and publish to Exchange
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          BUSINESS_GROUP_ID: ${{ secrets.BUSINESS_GROUP_ID }}
        run: |
          mvn --batch-mode clean deploy \
            --settings common/maven/settings.xml \
            -DskipMunitTests=true \
            -Dbusiness.group.id="$BUSINESS_GROUP_ID"

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/\.jar$/-$commitHash.jar/")
          mv "$artifactName1" "$artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout common-pipeline (for maven/settings.xml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/common-pipeline
          ref: ${{ inputs.common-ref }}
          path: common
          token: ${{ secrets.COMMON_REPO_TOKEN || github.token }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Set up Maven ${{ inputs.maven-version }}
        env:
          MAVEN_VERSION: ${{ inputs.maven-version }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar xz -C "$HOME"
          echo "$HOME/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          "$HOME/apache-maven-${MAVEN_VERSION}/bin/mvn" -v

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts

      - name: Deploy to CloudHub 2.0
        env:
          BUSINESS_GROUP_ID: ${{ secrets.BUSINESS_GROUP_ID }}
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          ANYPOINT_ENVIRONMENT: ${{ secrets.ANYPOINT_ENVIRONMENT }}
          ENV_CLIENT_ID: ${{ secrets.ENV_CLIENT_ID }}
          ENV_CLIENT_SECRET: ${{ secrets.ENV_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          MULE_ENV: ${{ secrets.MULE_ENV }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn --batch-mode mule:deploy \
            --settings common/maven/settings.xml \
            -Dmule.artifact="$artifactName" \
            -Dbusiness.group.id="$BUSINESS_GROUP_ID" \
            -Dca.client.id="$CA_CLIENT_ID" \
            -Dca.client.secret="$CA_CLIENT_SECRET" \
            -Dch.environment="$ANYPOINT_ENVIRONMENT" \
            -Dplatform.client.id="$ENV_CLIENT_ID" \
            -Dplatform.client.secret="$ENV_CLIENT_SECRET" \
            -Dmule.key="$ENCRYPTION_KEY" \
            -Denv="$MULE_ENV" \
            -Dapplication.name="$APP_NAME"
